[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rotalog-backend"
version = "0.2.0"
description = "API backend do RotaLog"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1.0",
    # CLI de smoke HTTP e compatibilidade com os workflows existentes (pip install .).
    "httpx>=0.28,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.20,<1",
    "pwdlib[argon2]>=0.3,<1",
    "PyJWT>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2,<2.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/rotalog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
