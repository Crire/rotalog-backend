name: Validação pós-merge (main)

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-main:
    name: Build e testes da main
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROTALOG_ENVIRONMENT: test
      ROTALOG_DATABASE_URL: postgresql+psycopg://rotalog:ci_only@localhost:5432/rotalog_test
      ROTALOG_TEST_DATABASE_URL: postgresql+psycopg://rotalog:ci_only@localhost:5432/rotalog_test
      ROTALOG_JWT_SECRET: ci-only-synthetic-token-key-never-use-in-production
      ROTALOG_DEMO_ENABLED: "true"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rotalog
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: rotalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rotalog -d rotalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v7

      - name: Configurar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pytest

      - name: Build de produção
        run: python -m compileall -q src migrations

      - name: Validar importação da aplicação
        run: PYTHONPATH=src python -c "from rotalog.api.main import app; assert app.title == 'RotaLog API'"

      - name: Testes
        run: |
          if find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null | grep -q .; then
            python -m pytest
          else
            echo "Nenhum teste Python encontrado; etapa concluída sem testes para executar."
          fi

      - name: Validar migrações versionadas
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
